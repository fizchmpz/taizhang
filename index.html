<script>
(function(){
  function show(msg){
    var d=document.getElementById('__diag');
    if(!d){d=document.createElement('div');d.id='__diag';
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#7a1010;color:#fff;font:12px/1.55 monospace;padding:10px 12px;white-space:pre-wrap;max-height:70%;overflow:auto';
      (document.body||document.documentElement).appendChild(d);}
    d.appendChild(document.createTextNode(msg+'\n'));
  }
  window.onerror=function(m,src,l,c){
    show('JS 报错：'+m+'\n位置：'+String(src||'').split('/').pop()+':'+l+':'+c);
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    var r=e&&e.reason; show('Promise 报错：'+((r&&r.message)||r));
  });
  setTimeout(function(){
    var p=document.getElementById('page');
    if(p&&p.children.length===0&&!document.getElementById('__diag')){
      show('页面过了 8 秒还是空的：HTML 到了，但脚本没跑起来。\n把这一屏截图发我。');
    }
  },8000);
})();
</script>

let allQ='', allSheet='', allLimit=60;

/* ---------- 本地服务探测 + 写回 ---------- */
let API_BASE;              // undefined=没探过, ''=同源, 'http://ip:port'=跨源, false=不可用
const QKEY = 'taizhang_pending_v1';
function qAll(){ try{return JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){return [];} }
function qSave(q){ try{ localStorage.setItem(QKEY, JSON.stringify(q)); }catch(e){} }

async function detectApi(force){
  if(!force && API_BASE!==undefined) return API_BASE;
  const prot = location.protocol;
  if(prot==='http:'||prot==='https:'){
    // 同源也要先探一次：云端静态托管（外网版）同样跑在 https 下，但没有 /api
    try{
      const c = new AbortController(); const t = setTimeout(()=>c.abort(), 1200);
      const r = await fetch('/api/ping', {signal:c.signal}); clearTimeout(t);
      if(r.ok){
        let j=null; try{ j = await r.json(); }catch(e){}
        if(j && j.ok && j.port){ API_BASE=''; flushQueue(); return ''; }
      }
    }catch(e){}
  }
  for(const b of ['http://127.0.0.1:8777','http://localhost:8777']){
    try{
      const c = new AbortController(); const t = setTimeout(()=>c.abort(), 900);
      const r = await fetch(b+'/api/ping', {signal:c.signal}); clearTimeout(t);
      if(r.ok){ API_BASE=b; flushQueue(); return b; }
    }catch(e){}
  }
  API_BASE = false; return false;
}
async function api(path, body){
  const base = await detectApi();
  if(base===false) return {ok:false, offline:true, error:'没连上本地服务（8777）'};
  try{
    const r = await fetch(base+path, body ? {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)} : {});
    return await r.json();
  }catch(e){ return {ok:false, offline:true, error:String(e.message||e)}; }
}
async function flushQueue(){
  const q = qAll(); if(!q.length) return;
  const rest = [];
  for(const j of q){
    const r = await api('/api/update', j);
    if(!r.ok) rest.push(j);
  }
  qSave(rest);
  if(!rest.length) toast('之前暂存的 '+q.length+' 处改动已补写进台账');
}

/* ---------- 标记完成 ---------- */
let undoTimer = null;
async function markDone(kind, row){
  const cfg = MINI[kind];
  const item = cfg.pool.find(x=>x.row===row);
  const el = document.querySelector('.mrow[data-kind="'+kind+'"][data-row="'+row+'"]');
  if(!item || !el || el.classList.contains('busy')) return;
  el.classList.add('done','busy');
  const job = {sheet:cfg.sheet, row:row, verify:{[cfg.vcol]:item.vt}, changes:cfg.done(D.today)};
  const r = await api('/api/update', job);
  if(r.offline){
    qSave([...qAll(), job]);
    toast('没连上本地服务，这条先存在本机；双击「启动台账手机版.bat」后自动补写');
  } else if(!r.ok){
    el.classList.remove('done','busy');
    toast('没写进去：'+r.error);
    return;
  }
  const h = el.getBoundingClientRect().height;
  el.style.height = h+'px'; el.style.overflow='hidden';
  requestAnimationFrame(()=>{
    el.style.height='0px'; el.style.paddingTop='0'; el.style.paddingBottom='0'; el.style.opacity='0';
  });
  setTimeout(()=>{
    hiddenRows[kind].add(row); mountMinis(); bumpKpi(kind,-1);
  }, 300);
  showUndo(kind, item);
}
function bumpKpi(kind, delta){
  const card = document.getElementById('kpi-'+kind); if(!card) return;
  const b = card.querySelector('.big b'); if(!b) return;
  const n = parseInt(b.textContent, 10);
  if(!isNaN(n)) b.textContent = String(Math.max(0, n+delta));
}
function showUndo(kind, item){
  const bar = $('#undo'); if(!bar) return;
  bar.querySelector('span').textContent = '已标记完成：' + item.name.slice(0,16);
  bar.classList.add('on');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>bar.classList.remove('on'), 9000);
  bar.querySelector('button').onclick = async ()=>{
    bar.classList.remove('on');
    const cfg = MINI[kind];
    const back = {sheet:cfg.sheet, row:item.row, verify:{[cfg.vcol]:item.vt}, changes:cfg.undo(item)};
    const r = await api('/api/update', back);
    if(r.offline) qSave([...qAll(), back]);
    if(r.ok || r.offline){
      hiddenRows[kind].delete(item.row); mountMinis(); bumpKpi(kind,1);
      toast('已撤销，这条回到卡上');
    } else { toast('撤销没成功：'+r.error); }
  };
}

async function loadTasks(){

function renderTasks(q){
  const box = $('#plist'); if(!box || !TASKS) return;
  const k = (q||'').toLowerCase();
  const list = TASKS.filter(t=>!k || (t.title+' '+t.project+' '+t.path).toLowerCase().includes(k));
  $('#pcount').textContent = list.length+' / '+TASKS.length+' 个';
  box.innerHTML = list.length ? list.slice(0,300).map(t=>
    '<div class="wbitem" data-path="'+esc(t.path)+'">'
    + '<span class="t">'+esc(t.title)+'</span>'
    + '<div class="m"><b>'+esc(t.project)+'</b><span>'+esc(t.date)+'</span></div>'
    + '<div class="p">'+esc(t.path)+'</div></div>').join('')
    : '<div class="wbempty">没有匹配的任务</div>';
}
async function pickTask(path){
  if(!taskCtx) return;
  const t = TASKS.find(x=>x.path===path); if(!t) return;
  const cfg = MINI[taskCtx.kind];
  const item = cfg.pool.find(x=>x.row===taskCtx.row);
  const val = 'WorkBuddy · '+t.title+' | '+t.date+' | '+t.path;
  const job = {sheet:cfg.sheet, row:taskCtx.row, verify:{[cfg.vcol]:item.vt}, changes:{[cfg.linkCol]:val}};
  curPath = t.path;
  const r = await api('/api/update', job);
  if(r.offline){
    qSave([...qAll(), job]);
    toast('没连上本地服务，关联先存在本机，服务起来后自动补写');
  } else if(!r.ok){
    toast('关联没写进去：'+r.error); return;
  }
  item.link = val;
  mountMinis(); closeTaskPanel();
  toast('已关联，台账「'+cfg.linkCol+'」列里存了路径');
}
async function clearLink(){
  if(!taskCtx) return;
  const cfg = MINI[taskCtx.kind];
  const item = cfg.pool.find(x=>x.row===taskCtx.row);
  const job = {sheet:cfg.sheet, row:taskCtx.row, verify:{[cfg.vcol]:item.vt}, changes:{[cfg.linkCol]:''}};
  const r = await api('/api/update', job);
  if(r.offline) qSave([...qAll(), job]);
  else if(!r.ok){ toast('没清掉：'+r.error); return; }
  item.link = ''; mountMinis(); closeTaskPanel(); toast('已取消关联');
}
function copyPath(){
  if(!curPath){ toast('先点一条任务，路径才会显示在这里'); return; }
  try{ navigator.clipboard.writeText(curPath); toast('路径已复制'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = curPath; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('路径已复制'); }catch(e2){ toast(curPath); }
    ta.remove();
  }
}

document.addEventListener('click', e=>{
  const act = e.target.closest('.mops button');
  if(act){
    const box = act.closest('.mrow');
    const kind = box.getAttribute('data-kind');
    const row = parseInt(box.getAttribute('data-row'), 10);
    if(act.getAttribute('data-act')==='done'){ markDone(kind, row); }
    else { openTaskPanel(kind, row); }
    return;
  }
  if(e.target.closest('#mask') || e.target.closest('#panelClose')){ closeTaskPanel(); return; }
  const ti = e.target.closest('.wbitem');
  if(ti){ pickTask(ti.getAttribute('data-path')); return; }
  if(e.target.closest('#pclear')){ clearLink(); return; }
  if(e.target.closest('#pcopy')){ copyPath(); return; }
  const nav = e.target.closest('.nav a');
  if(nav){ location.hash = '#/' + nav.getAttribute('data-k'); return; }
  const ent = e.target.closest('[data-k]');
  if(ent){
    const k = ent.getAttribute('data-k');
    if(k==='pr'){toast('准则提炼标准：原文 / 有取舍方向 / 跨场景 / 有行为印证 / 不是病 → 见 v3.1 定版第五节');return;}
    if(VIEWS[k]){ location.hash = '#/' + k; return; }
  }
  const tab = e.target.closest('[data-tab]');
  if(tab){ knowTab = tab.getAttribute('data-tab'); render(); return; }
  const td = e.target.closest('[data-todo]');
  if(td){
    const b = td.querySelector('.box');
    const on = b.style.background === 'rgba(184, 0, 0, 0.35)' || b.dataset.on==='1';
    if(on){ b.dataset.on='0'; b.style.background=''; b.style.borderColor='';
      b.innerHTML=''; }
    else { b.dataset.on='1'; b.style.background='rgba(184,0,0,.35)'; b.style.borderColor='#E03A3A';
      b.innerHTML='<svg viewBox="0 0 24 24" style="width:11px;height:11px;display:block;margin:1px" fill="none" stroke="#fff" stroke-width="3.4"><path d="m5 13 5 5 9-11"/></svg>'; }
    toast('界面里勾上了。真写回 xlsx 要等 G3 通道 —— 现在关掉页面就复原，不会动台账');
  }
});

window.addEventListener('hashchange', render);
render();
</script></body></html>
